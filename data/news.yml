- title: "Selected for an AWS Skill Builder scholarship (AI for ALL)"
  image: "/assets/img/news/2026-aws-skill-builder.svg"
  kind: announcement
  sortdate: "2026-11-05"
  date_label: "5 Nov 2026"
  summary: "Selected for an AWS Skill Builder Team Subscription under the AI for ALL programme run by True Digital Academy (TDA) with Amazon Web Services. The scholarship gives free access to AWS self-paced courses, hands-on Builder Labs and exam-preparation material for a four-month learning period, 6 November 2026 to 28 February 2027, with at least one course to be completed by 31 December 2026. Course certificates will be added here as they are earned."

- title: "Nominated for a Government Science and Technology Scholarship"
  image: "/assets/img/news/2026-gov-scholarship.svg"
  kind: announcement
  sortdate: "2026-10-22"
  date_label: "22 Oct 2026"
  summary: "The School of Engineering, KMITL, nominated Thammarat as its designated personnel candidate in a request for one Government Science and Technology Scholarship (Public Sector Personnel Development), targeted at semiconductors and advanced electronics with an emphasis on optics and photonics. The planned course of study is the M.Sc. in Optics and Photonics at the Karlsruhe Institute of Technology (KIT), Germany, from the Winter Semester 2027/28. The allocation has not yet been decided."
  link: "/recognition/index.qmd"
  link_label: "Recognition"

- title: "Thai PBS: Thai students on the world research stage, developing neutrino detection technology"
  image: "/assets/img/news/2026-thaipbs.svg"
  title_original: "นักศึกษาไทยเจ๋ง! บุกเวทีวิจัยโลก ร่วมพัฒนาเทคโนโลยีตรวจจับนิวทริโน เชื่อมโยงความสำเร็จ Nobel Prize in Physics 2026"
  kind: media
  outlet: "Thai PBS Sci & Tech (Thai Genius)"
  sortdate: "2026-10-13"
  date_label: "13 Oct 2026"
  summary: "Thai PBS profiled Thammarat's selection as Thailand's representative in the IceCube Summer Student Program 2025, supported through the Information Technology Foundation under the Initiative of HRH Princess Maha Chakri Sirindhorn. The article describes his June–July 2025 research at WIPAC with the LOM research and development team: optical-module assembly and integration, a software workflow, and analysis of cosmic-ray muon data from six LOM-16 modules (96 PMTs), presented at the WIPAC Group Meeting on 28 July 2025. It places the work in the context of high-energy neutrino detection recognised by the 2026 Nobel Prize in Physics."
  url: "https://www.thaipbs.or.th/sciandtech/thai-genius/icecube-neutrino-observatory"
  language: "Thai"

