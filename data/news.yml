- title: "KMITL engineering students received in audience before departing for international summer programmes"
  image: "/assets/img/news/2025-departure.svg"
  title_original: "นศ.วิศวลาดกระบัง ภาคฤดูร้อน เข้าเฝ้าฯ กรมสมเด็จพระเทพฯ"
  kind: media
  outlet: "KMITL School of Engineering"
  sortdate: "2025-05-27"
  date_label: "27 May 2025"
  summary: "On 13 May 2025, HRH Princess Maha Chakri Sirindhorn granted an audience to the Information Technology Foundation and the 2025 summer-programme participants (CERN, DESY, GSI, IceCube and ITER) before their departure. The faculty news names Thammarat, then a third-year Mechatronics and Automation Engineering student, as Thailand's selected representative for the IceCube programme at WIPAC and the first engineering student from Thailand selected for it."
